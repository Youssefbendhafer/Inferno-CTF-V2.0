ServerName localhost

# Allow encoded slashes and dots in URLs without decoding/rejecting them
AllowEncodedSlashes NoDecode

<VirtualHost *:8080>
    DocumentRoot /var/www/html
    ServerAlias *

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
        AddType application/json .json

        RewriteEngine On
        RewriteRule ^api/v1/relic(/.*)?$ /api/v1/relic.php [L,QSA,NE]
    </Directory>

    <FilesMatch "\.php$">
        SetHandler application/x-httpd-php
    </FilesMatch>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
